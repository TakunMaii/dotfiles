# Enable shadows
shadow = true;
shadow-radius = 7;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-opacity = 0.75;

# Enable fading
fading = true;
fade-in-step = 0.1;
fade-out-step = 0.1;

# Set opacity for inactive windows
# inactive-opacity = 0.8;
# frame-opacity = 0.7;

shadow-exclude = [
  "class_g = 'Polybar'",
  "window_type = 'dock'",
  "_GTK_FRAME_EXTENTS@:c"
];

rounded-corners-exclude = [
  "class_g = 'Polybar'",
  "window_type = 'dock'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Enable rounded corners
corner-radius = 10;

# Enable VSync
vsync = true;

# Backend settings
backend = "glx";
