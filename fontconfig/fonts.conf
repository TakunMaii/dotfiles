<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- 为 sans-serif 字体族设置首选字体 -->
  <alias>
    <family>sans-serif</family>
    <prefer>
		<family>Microsoft YaHei</family>
    </prefer>
  </alias>

  <!-- 同样为 serif 和 monospace 设置，按需添加 -->
  <alias>
    <family>serif</family>
    <prefer>
		<family>SimHei</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
		<family>CaskaydiaCove NFM</family>
    </prefer>
  </alias>
</fontconfig>
