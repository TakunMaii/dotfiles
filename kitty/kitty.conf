font_family      CaskaydiaCove Nerd Font Mono
bold_font        CaskaydiaCove Nerd Font Mono:style=Bold
italic_font      CaskaydiaCove Nerd Font Mono:style=Italic
bold_italic_font CaskaydiaCove Nerd Font Mono:style=Bold Italic

# Use SimHei for Chinese CJK glyphs while keeping the main monospace font for ASCII.
symbol_map U+3000-U+303F,U+3400-U+4DBF,U+4E00-U+9FFF,U+F900-U+FAFF,U+FF00-U+FFEF SimHei
font_size 12.0

cursor_shape block
cursor_shape_unfocused hollow
cursor_trail 1
cursor_trail_decay 0.1 0.4

enable_audio_bell no

background_opacity 0.8
background_blur 10

# colorcheme
foreground              #d0d0d0
background              #111118
selection_background    #1a3a5c
selection_foreground    #ffffff

url_color               #4ec0e9
url_style               curly

cursor                  #4ec0e9
cursor_text_color       #0a1128

# 标准色
color0                  #0f1b33
color1                  #ff6b6b
color2                  #51cf66
color3                  #fcc419
color4                  #4dabf7
color5                  #cc5de8
color6                  #22b8cf
color7                  #dee2e6

# 亮色
color8                  #1c2f4a
color9                  #ff8787
color10                 #69db7c
color11                 #ffd43b
color12                 #74c0fc
color13                 #da77f2
color14                 #3bc9db
color15                 #f1f3f5

# 调色板扩展（可选）
color16                 #ff922b
color17                 #f06595

# 常用蓝色系强调
active_tab_background   #1a3a6a
active_tab_foreground   #e0f0ff
inactive_tab_background #0a1428
inactive_tab_foreground #5a7a9a

# 边框
tab_bar_background      #060e1e
wayland_titlebar_color  system
window_padding_width 5.0
